<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7e4c4"/>
      <stop offset="0.55" stop-color="#f1dcc0"/>
      <stop offset="1" stop-color="#e7dcc0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f6c96b"/>
      <stop offset="0.55" stop-color="#ef9a5a"/>
      <stop offset="1" stop-color="#df6a4b"/>
    </radialGradient>
    <linearGradient id="wave" x1="48" y1="330" x2="464" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f9d85"/>
      <stop offset="1" stop-color="#74b394"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- faded sun -->
  <circle cx="256" cy="208" r="92" fill="url(#sun)"/>
  <!-- warm horizon haze -->
  <rect x="0" y="300" width="512" height="120" fill="#f0c98a" opacity="0.22"/>
  <!-- two stacked sea-teal waves -->
  <path d="M40 330 C 104 296, 144 366, 208 332 S 304 296, 368 332 S 440 366, 472 330"
    stroke="url(#wave)" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M40 392 C 104 356, 144 430, 208 392 S 304 354, 368 392 S 440 430, 472 392"
    stroke="url(#wave)" stroke-width="30" stroke-linecap="round" fill="none"/>
</svg>
